name: CI & Deployment Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Quality & Regression Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pytest Suite
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          DEBUG: "false"
          SECRET_KEY: "test-secret-key-knowledge-navigator"
        run: |
          python -m pytest tests -v --tb=short

      - name: Execute End-to-End Audit Script
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          DEBUG: "false"
          SECRET_KEY: "test-secret-key-knowledge-navigator"
        run: |
          python scripts/comprehensive_final_audit.py

  deploy-trigger:
    name: Trigger Render Deployment Hook
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Webhook to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Dispatching deployment trigger to Render..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Deployment webhook triggered successfully."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not configured. Native Render GitHub auto-deploy will deploy the commit directly."
          fi

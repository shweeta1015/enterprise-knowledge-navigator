# ==============================================================================
# Render Blueprint Specification for Enterprise Knowledge Navigator
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: enterprise-knowledge-navigator
    runtime: python
    region: oregon
    # Note on Plans & Storage:
    # Render Disks require at least the 'starter' plan ($7/mo + $0.25/GB/mo).
    # If deploying on Render's 'free' plan, remove the 'disk' block, set 'plan: free',
    # and set 'DATA_DIR' to 'data' (ephemeral container filesystem).
    plan: starter
    disk:
      name: enterprise-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: LLM_PROVIDER
        value: "groq"
      - key: LLM_MODEL
        value: "llama-3.3-70b-versatile"
      - key: EMBEDDING_PROVIDER
        value: "huggingface"
      - key: EMBEDDING_MODEL
        value: "sentence-transformers/all-MiniLM-L6-v2"

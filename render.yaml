# ==============================================================================
# Render Blueprint Specification for Enterprise Knowledge Navigator
# Free Plan (Reference Specification - Cloud Deployment Postponed)
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================
# CURRENT OPERATIONAL STATUS:
# Cloud deployment is currently POSTPONED per user decision.
# The application is configured and operated locally on localhost.
# Automatic deployment is disabled (autoDeploy: false).
# This blueprint is preserved as a dormant reference if cloud deployment is
# requested at a future date.
# ==============================================================================

services:
  - type: web
    name: enterprise-knowledge-navigator
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: data
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: LLM_PROVIDER
        value: "groq"
      - key: LLM_MODEL
        value: "llama-3.3-70b-versatile"
      - key: EMBEDDING_PROVIDER
        value: "huggingface"
      - key: EMBEDDING_MODEL
        value: "sentence-transformers/all-MiniLM-L6-v2"
